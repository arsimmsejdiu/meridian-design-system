name: Deploy docs

on:
  push: { branches: [main] }
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # configure-pages GETs /repos/:owner/:repo/pages and 404s if Pages has
      # never been turned on. GITHUB_TOKEN cannot enable it, so we try once and
      # then tell the operator what to click — before spending a build on it.
      - name: Ensure GitHub Pages is enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          hdr=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          code=$(curl -sS -o /tmp/pages.json -w '%{http_code}' "${hdr[@]}" "$api")
          if [ "$code" = "404" ]; then
            created=$(curl -sS -o /tmp/pages.json -w '%{http_code}' "${hdr[@]}" -X POST "$api" -d '{"build_type":"workflow"}')
            if [ "$created" != "201" ]; then
              echo "::error::GitHub Pages is not enabled. Open Settings → Pages → Build and deployment, set Source to GitHub Actions, then re-run this workflow."
              cat /tmp/pages.json
              exit 1
            fi
          elif [ "$code" != "200" ]; then
            echo "::error::Could not read the GitHub Pages site (HTTP ${code})."
            cat /tmp/pages.json
            exit 1
          fi
      - uses: pnpm/action-setup@v4
        with: { version: '9.12.0' }
      - uses: actions/setup-node@v5
        with: { node-version: '22.11.0', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @meridian/docs build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v3
        with: { path: apps/docs/storybook-static }
      - id: deployment
        uses: actions/deploy-pages@v5
