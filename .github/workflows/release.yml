name: Release

on:
  push: { branches: [main] }

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: '9.12.0' }
      - uses: actions/setup-node@v5
        with:
          node-version: '22.11.0'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Changesets collects the pending changesets, bumps versions, writes the
      # changelogs and opens a "Version Packages" PR. Every change to a published
      # package needs a changeset, so the changelog is written by whoever made
      # the change rather than reconstructed from commit messages afterwards.
      #
      # `publish:` is deliberately not set. These packages are not on npm, and
      # wiring a publish step that fails on every run for want of a token teaches
      # everyone to ignore a red Release badge — which is the badge you least
      # want ignored. To start publishing: add an NPM_TOKEN secret and
      # `publish: pnpm release` below.
      - uses: changesets/action@v1
        with:
          version: pnpm version-packages
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
